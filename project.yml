name: ImgTranslate

options:
  bundleIdPrefix: dev.cyril
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
  generateEmptyDirectories: false

packages:
  mlx-swift-lm:
    url: https://github.com/ml-explore/mlx-swift-lm
    exactVersion: 3.31.4
  # 明確釘住:mlx-swift 0.31.5+ 的 Package.swift 要求 swift-tools-version 6.3,
  # runner 的 Swift 版本能不能滿足未知,0.31.4 是 tools-version 5.12,相容性最好。
  mlx-swift:
    url: https://github.com/ml-explore/mlx-swift
    exactVersion: 0.31.4
  swift-huggingface:
    url: https://github.com/huggingface/swift-huggingface
    exactVersion: 0.9.0
  swift-transformers:
    url: https://github.com/huggingface/swift-transformers
    exactVersion: 1.3.3

settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1,2"
    # LiveContainer 官方說 arm64e 未測試、建議 arm64
    ARCHS: arm64
    EXCLUDED_ARCHS: arm64e
    ONLY_ACTIVE_ARCH: NO
    ENABLE_BITCODE: NO
    ALWAYS_EMBED_SWIFT_STANDARD_LIBRARIES: NO
    # 不簽名:LiveContainer 會用自己的憑證重簽
    CODE_SIGN_IDENTITY: ""
    CODE_SIGNING_REQUIRED: NO
    CODE_SIGNING_ALLOWED: NO
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""
    ENABLE_USER_SCRIPT_SANDBOXING: NO

targets:
  ImgTranslate:
    type: application
    platform: iOS
    settings:
      base:
        # SWIFT_VERSION 特意放在 target 層級(不是 project 層級 settings.base):
        # mlx-swift-lm 的 manifest 是 tools 6.1、mlx-swift 是 5.12,放在 project
        # 層級有機會把 SPM package target 也強制降成 Swift 5,產生難懂的編譯錯誤。
        SWIFT_VERSION: "5.0"
        PRODUCT_BUNDLE_IDENTIFIER: dev.cyril.imgtranslate
        PRODUCT_NAME: ImgTranslate
    sources:
      - path: Sources
      - path: Fixtures
    dependencies:
      - sdk: Vision.framework
      # 刻意不連 MLXHuggingFace(官方 macro 路線會多拉 vendored xgrammar C++ +
      # swift-syntax macro plugin,編譯時間會爆掉)。改連 swift-huggingface +
      # swift-transformers,自己手寫轉接層(HuggingFaceBridge.swift)。
      - package: mlx-swift-lm
        products: [MLXLLM, MLXVLM, MLXLMCommon]
      - package: mlx-swift
        product: MLX
      - package: swift-huggingface
        product: HuggingFace
      - package: swift-transformers
        product: Tokenizers
    info:
      path: Support/Info.plist
      properties:
        CFBundleDisplayName: ImgTranslate
        UILaunchScreen: {}
        UIRequiredDeviceCapabilities:
          - arm64
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait

schemes:
  ImgTranslate:
    build:
      targets:
        ImgTranslate: all
    run:
      config: Release
    archive:
      config: Release
